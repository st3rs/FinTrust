name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    name: Lint and Build Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # using npm ci for clean, reliable installs

      - name: Type Check & Lint
        # Running tsc directly to ensure we get a non-zero exit code on failure 
        # (overriding the '|| true' present in the package.json lint script)
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build

      - name: Install document service dependencies
        working-directory: services/docgen
        run: npm ci

      - name: Type-check document service
        working-directory: services/docgen
        run: npm run typecheck

      - name: Build document service
        working-directory: services/docgen
        run: npm run build
